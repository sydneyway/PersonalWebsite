<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Paint — Sydney Way</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
  }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #d9d9d9;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(6px, 2vw, 18px);
    overflow: hidden;
  }
  .paint-window {
    width: min(1100px, 100%);
    height: min(96vh, 900px);
    max-height: 100vh;
    background: #f3f3f3;
    border: 1px solid #777;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,.25);
    display: flex;
    flex-direction: column;
  }
  .header {
    height: 52px;
    background: #7112B0;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 18px;
    font-size: 21px;
    font-weight: 600;
    position: relative;
  }
  .home-button {
    position: absolute;
    left: 10px;
    top: 4px;
    width: 48px;
    height: 44px;
    border: 0;
    background: transparent;
    color: white;
    cursor: pointer;
    font-size: 38px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
  }
  .home-button:hover {
    background: rgba(255,255,255,.18);
  }
  .home-button svg {
    width: 34px;
    height: 34px;
    fill: white;
    display: block;
  }
  .titlebar {
    height: 42px;
    background: #eee;
    border-bottom: 1px solid #aaa;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
    font-size: 18px;
    font-weight: 600;
  }
  .titlebar .spacer { flex: 1; }
  .window-buttons { display: flex; gap: 16px; }
  .workspace {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .toolbar {
    width: clamp(175px, 20vw, 215px);
    flex-shrink: 0;
    padding: 12px;
    border-right: 1px solid #aaa;
    background: #eee;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .actions-bar {
    padding: 9px 12px;
    border-bottom: 1px solid #aaa;
    background: #eee;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .actions-bar .group-title {
    margin: 0 5px 0 0;
  }
  .group {
    padding-bottom: 12px;
    border-bottom: 1px solid #bbb;
  }
  .group:last-child { border-bottom: 0; }
  .group-title {
    font-size: 12px;
    font-weight: 600;
    color: #555;
    margin-bottom: 7px;
    text-transform: uppercase;
  }
  .tools {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }
  button.tool {
    height: 42px;
    border: 1px solid #aaa;
    border-radius: 8px;
    background: #fafafa;
    color: #111;
    cursor: pointer;
    font-size: 15px;
    font-family: "Segoe UI", Arial, sans-serif;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 9px;
    padding: 0 10px;
  }
  button.tool .tool-icon {
    width: 26px;
    text-align: center;
    font-size: 20px;
    line-height: 1;
  }
  button.tool:hover { background: #e4e4e4; }
  button.tool.active {
    background: #cce5ff;
    border-color: #1976d2;
    box-shadow: inset 0 0 0 1px #1976d2;
  }
  .actions {
    display: flex;
    gap: 6px;
  }
  .action {
    border: 1px solid #999;
    border-radius: 8px;
    background: white;
    padding: 8px 6px;
    cursor: pointer;
  }
  .action:hover { background: #e7e7e7; }
  .size-control {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #size { width: 70px; }
  #color {
    width: 100%;
    height: 40px;
    padding: 2px;
    border: 1px solid #999;
    border-radius: 8px;
    cursor: pointer;
  }
  .canvas-area {
    flex: 1;
    min-width: 0;
    min-height: 0;
    padding: clamp(6px, 1.5vw, 14px);
    overflow: auto;
    background: #bdbdbd;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    background: white;
    border: 1px solid #555;
    border-radius: 8px;
    cursor: crosshair;
    touch-action: none;
    transform-origin: center center;
  }
  .colors {
    padding: clamp(6px, 1vh, 10px) clamp(8px, 1.5vw, 14px) clamp(7px, 1vh, 12px);
    border-top: 1px solid #aaa;
    background: #eee;
  }
  .color-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .color-label {
    font-size: 13px;
    font-weight: 600;
  }
  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .swatch {
    width: 25px;
    height: 25px;
    border: 1px solid #555;
    border-radius: 5px;
    cursor: pointer;
  }
  .swatch:hover { outline: 2px solid #1976d2; }
  .statusbar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 10px;
    border-top: 1px solid #aaa;
    background: #eee;
    font-size: 13px;
  }
  .hint { color: #555; }
  #zoomLabel {
    min-width: 48px;
    text-align: center;
  }


  @media (max-width: 700px) {
    .workspace {
      flex-direction: column;
      height: clamp(360px, calc(100vh - 330px), 610px);
    }
    .toolbar {
      width: 100%;
      max-height: 220px;
      border-right: 0;
      border-bottom: 1px solid #aaa;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .tools {
      grid-template-columns: 1fr;
    }
    .canvas-area {
      min-height: 0;
      flex: 1;
      overflow: auto;
    }
    .actions-bar {
      flex-wrap: wrap;
    }
    .color-row {
      flex-wrap: wrap;
    }
  }
</style>
</head>
<body>
<div class="paint-window">
  <div class="header">
    <button class="home-button" id="homeButton" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5L12 3l9 7.5v9a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"></path>
      </svg>
    </button>
    <span>Sydney Way</span>
  </div>


  <div class="titlebar">
    <span>🎨 Mini Paint</span>
  </div>


  <div class="actions-bar">
    <div class="group-title">Actions</div>
    <div class="actions">
      <button class="action" id="undo">↶ Undo</button>
      <button class="action" id="redo">↷ Redo</button>
      <button class="action" id="clear">Clear</button>
      <button class="action" id="save">⬇️ Download</button>
    </div>
  </div>


  <div class="workspace">
    <aside class="toolbar">
      <div class="group">
        <div class="group-title">Tools</div>
        <div class="tools">
          <button class="tool active" data-tool="pencil" title="Pencil"><span class="tool-icon">✏️</span><span>Pencil</span></button>
          <button class="tool" data-tool="brush" title="Brush"><span class="tool-icon">🖌️</span><span>Brush</span></button>
          <button class="tool" data-tool="bucket" title="Paint Bucket"><span class="tool-icon">🪣</span><span>Paint Bucket</span></button>
          <button class="tool" data-tool="eraser" title="Eraser"><span class="tool-icon">🧽</span><span>Eraser</span></button>
          <button class="tool" data-tool="line" title="Line"><span class="tool-icon">╱</span><span>Line</span></button>
          <button class="tool" data-tool="rectangle" title="Rectangle"><span class="tool-icon">⬜</span><span>Rectangle</span></button>
          <button class="tool" data-tool="circle" title="Circle"><span class="tool-icon">⭕</span><span>Circle</span></button>
        </div>
      </div>


      <div class="group">
        <div class="group-title">Brush size</div>
        <div class="size-control">
          <input id="size" type="number" min="1" max="80" value="3">
          <span>px</span>
        </div>
      </div>
    </aside>


    <main class="canvas-area">
      <canvas id="canvas" width="1200" height="1200"></canvas>
    </main>
  </div>


  <div class="colors">
    <div class="color-row">
      <span class="color-label">Colors</span>
      <input id="color" type="color" value="#000000">
      <div class="swatches" id="swatches"></div>
    </div>
  </div>


  <div class="statusbar">
    <span id="toolStatus">Tool: Pencil</span>
    <span class="hint">Mouse: draw • Shift: constrain shapes</span>
    <span id="zoomLabel">100%</span>
    <span id="coords">0, 0</span>
  </div>
</div>


<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const colorInput = document.getElementById("color");
const sizeInput = document.getElementById("size");
const toolStatus = document.getElementById("toolStatus");
const coords = document.getElementById("coords");


let tool = "pencil";
let drawing = false;
let startX = 0, startY = 0;
let snapshot = null;
let history = [];
let historyIndex = -1;


document.getElementById("homeButton").addEventListener("click", () => {
  window.location.href = "index.html";
});


const swatchColors = [
  "#000000","#ffffff","#808080","#c0c0c0",
  "#ff0000","#ff9900","#ffff00","#00aa00",
  "#00aaff","#0000ff","#9900ff","#ff00aa",
  "#8b4513","#f4a460","#ffc0cb","#800000"
];


const swatches = document.getElementById("swatches");
swatchColors.forEach(c => {
  const s = document.createElement("button");
  s.className = "swatch";
  s.style.background = c;
  s.title = c;
  s.addEventListener("click", () => colorInput.value = c);
  swatches.appendChild(s);
});


function saveState() {
  if (historyIndex < history.length - 1) {
    history = history.slice(0, historyIndex + 1);
  }
  history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (history.length > 30) history.shift();
  historyIndex = history.length - 1;
}


function restoreState(index) {
  if (index < 0 || index >= history.length) return;
  ctx.putImageData(history[index], 0, 0);
  historyIndex = index;
}


function clearCanvas() {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  saveState();
}


clearCanvas();


document.querySelectorAll(".tool").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tool").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    tool = btn.dataset.tool;
    toolStatus.textContent = "Tool: " + btn.title;
  });
});


let zoom = 1;


function updateZoom() {
  canvas.style.transform = `scale(${zoom})`;
  document.getElementById("zoomLabel").textContent = Math.round(zoom * 100) + "%";
}


function position(e) {
  const r = canvas.getBoundingClientRect();
  // Always use the actual rendered rectangle. This accounts for responsive
  // sizing, browser zoom, and the canvas's scroll-wheel transform.
  const x = ((e.clientX - r.left) / r.width) * canvas.width;
  const y = ((e.clientY - r.top) / r.height) * canvas.height;
  return {
    x: Math.max(0, Math.min(canvas.width - 1, x)),
    y: Math.max(0, Math.min(canvas.height - 1, y))
  };
}


canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const oldZoom = zoom;
  zoom += e.deltaY < 0 ? 0.1 : -0.1;
  zoom = Math.max(0.5, Math.min(3, zoom));


  if (zoom !== oldZoom) {
    updateZoom();
  }
}, { passive: false });


updateZoom();


function setupStroke() {
  ctx.strokeStyle = colorInput.value;
  ctx.fillStyle = colorInput.value;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = Number(sizeInput.value);
}


function drawFreehand(x, y) {
  setupStroke();
  if (tool === "eraser") ctx.strokeStyle = "#ffffff";
  if (tool === "brush") ctx.lineWidth = Number(sizeInput.value) * 3;
  ctx.lineTo(x, y);
  ctx.stroke();
}


function floodFill(x, y) {
  const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = image.data;
  const sx = Math.floor(x), sy = Math.floor(y);
  const start = (sy * canvas.width + sx) * 4;
  const target = [data[start], data[start + 1], data[start + 2], data[start + 3]];
  const fillHex = colorInput.value;
  const fill = [
    parseInt(fillHex.slice(1,3), 16),
    parseInt(fillHex.slice(3,5), 16),
    parseInt(fillHex.slice(5,7), 16),
    255
  ];


  if (target.every((v, i) => v === fill[i])) return;


  const matches = (idx) =>
    data[idx] === target[0] &&
    data[idx + 1] === target[1] &&
    data[idx + 2] === target[2] &&
    data[idx + 3] === target[3];


  const stack = [[sx, sy]];
  const visited = new Uint8Array(canvas.width * canvas.height);


  while (stack.length) {
    const [px, py] = stack.pop();
    if (px < 0 || py < 0 || px >= canvas.width || py >= canvas.height) continue;


    const pos = py * canvas.width + px;
    if (visited[pos]) continue;


    const idx = pos * 4;
    if (!matches(idx)) continue;


    visited[pos] = 1;
    data[idx] = fill[0];
    data[idx + 1] = fill[1];
    data[idx + 2] = fill[2];
    data[idx + 3] = fill[3];


    stack.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
  }


  ctx.putImageData(image, 0, 0);
}


function constrainedEnd(x, y, shape, shiftKey) {
  if (!shiftKey) return {x, y};
  const dx = x - startX, dy = y - startY;
  if (shape === "line") {
    const angle = Math.atan2(dy, dx);
    const snap = Math.round(angle / (Math.PI / 4)) * (Math.PI / 4);
    const length = Math.hypot(dx, dy);
    return {
      x: startX + Math.cos(snap) * length,
      y: startY + Math.sin(snap) * length
    };
  }
  const side = Math.max(Math.abs(dx), Math.abs(dy));
  return {
    x: startX + Math.sign(dx) * side,
    y: startY + Math.sign(dy) * side
  };
}


function drawShape(x, y, shiftKey) {
  setupStroke();
  ctx.beginPath();


  if (tool === "line") {
    const p = constrainedEnd(x, y, "line", shiftKey);
    ctx.moveTo(startX, startY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  } else if (tool === "rectangle") {
    const p = constrainedEnd(x, y, "rectangle", shiftKey);
    ctx.strokeRect(startX, startY, p.x - startX, p.y - startY);
  } else if (tool === "circle") {
    const p = constrainedEnd(x, y, "circle", shiftKey);
    const radius = Math.hypot(p.x - startX, p.y - startY);
    ctx.arc(startX, startY, radius, 0, Math.PI * 2);
    ctx.stroke();
  }
}


canvas.addEventListener("pointerdown", e => {
  drawing = true;
  canvas.setPointerCapture(e.pointerId);
  const p = position(e);
  startX = p.x;
  startY = p.y;


  if (tool === "bucket") {
    drawing = false;
    floodFill(startX, startY);
    saveState();
    return;
  }


  if (["line","rectangle","circle"].includes(tool)) {
    snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  } else {
    setupStroke();
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    drawFreehand(startX + 0.01, startY + 0.01);
  }
});


canvas.addEventListener("pointermove", e => {
  const p = position(e);
  coords.textContent = Math.round(p.x) + ", " + Math.round(p.y);
  if (!drawing) return;


  if (["line","rectangle","circle"].includes(tool)) {
    ctx.putImageData(snapshot, 0, 0);
    drawShape(p.x, p.y, e.shiftKey);
  } else {
    drawFreehand(p.x, p.y);
  }
});


canvas.addEventListener("pointerup", () => {
  if (!drawing) return;
  drawing = false;
  ctx.closePath();
  saveState();
});


canvas.addEventListener("pointercancel", () => drawing = false);


document.getElementById("undo").addEventListener("click", () => {
  if (historyIndex > 0) restoreState(historyIndex - 1);
});


document.getElementById("redo").addEventListener("click", () => {
  if (historyIndex < history.length - 1) restoreState(historyIndex + 1);
});


document.getElementById("clear").addEventListener("click", clearCanvas);


document.getElementById("save").addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = "sydney-way-mini-paint.png";
  link.href = canvas.toDataURL("image/png");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
});
</script>
</body>
</html>
